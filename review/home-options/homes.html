<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Aref Ruqaa";font-weight:700;src:url(aref-ruqaa-700-arabic.woff2) format("woff2");unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
body{margin:0;background:#222;display:flex;gap:20px;padding:20px;direction:rtl}
.s{position:relative;width:390px;height:844px;overflow:hidden;border-radius:18px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,32,.55) 0,rgba(8,12,32,0) 26%,rgba(8,12,32,0) 70%,rgba(8,12,32,.8) 100%)}
.t{position:absolute;top:56px;left:0;right:0;text-align:center}
.t h1{margin:0;font:700 80px/1.1 "Aref Ruqaa",serif;color:#F2C96B;-webkit-text-stroke:5px #281E19;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.55)}
.t p{margin:6px 0 0;font:700 22px "Aref Ruqaa",serif;color:#F3E9D6;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.b{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);box-sizing:border-box;width:280px;height:58px;display:flex;align-items:center;justify-content:center;border-style:solid;border-width:0 64px;border-image:url(plate-burgundy.webp) 0 142 fill / 0 64px stretch;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.b span{font:700 24px "Aref Ruqaa",serif;color:#F2C96B;-webkit-text-stroke:2px #281E19;paint-order:stroke fill;white-space:nowrap}
.f{position:absolute;bottom:34px;left:0;right:0;text-align:center;font:500 13px Tajawal,sans-serif;color:#d9c9a8}
.n{position:absolute;top:8px;right:10px;font:700 14px Tajawal;color:#fff;background:rgba(0,0,0,.5);padding:2px 10px;border-radius:9px}
</style></head><body>
<script>
[['crest','١'],['still','٢'],['majlis','٣'],['desert','٤']].forEach(([k,n])=>document.write(`<div class="s"><div class="bg" style="background-image:url(h_${k}.jpg)"></div><div class="sh"></div><div class="t"><h1>المعزّب</h1><p>ليلة الأربعين</p></div><div class="b"><span>ادخل الديوانية</span></div><div class="f">الأبواب مفتوحة حتى الفجر</div><div class="n">${n}</div></div>`));
</script></body></html>
