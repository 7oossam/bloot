<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:"Amiri";font-weight:700;src:url(amiri.ttf)}@font-face{font-family:"El Messiri";font-weight:700;src:url(elmessiri.ttf)}@font-face{font-family:"Reem Kufi";font-weight:700;src:url(reemkufi.ttf)}</style>
<style>
body{margin:0;background:#2b2b2b;display:grid;grid-template-columns:repeat(3,390px);gap:20px;padding:20px;direction:rtl}
.s{position:relative;width:390px;height:844px;overflow:hidden;border-radius:18px;background:#F5EDDC}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.t{position:absolute;top:44px;left:0;right:0;text-align:center}
.t h1{margin:0;font-size:64px;line-height:1.15;color:#9E1B26}
.t .rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px auto 0;width:220px}
.t .rule i{flex:1;height:1.5px;background:#C9973E}
.t .rule b{width:9px;height:9px;background:#C9973E;transform:rotate(45deg)}
.t p{margin:4px 0 0;font-size:18px;color:#221A16}
.b{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);width:230px;height:62px;border-radius:10px;background:#F5EDDC;border:2.5px solid #C9973E;box-shadow:inset 0 0 0 4px #F5EDDC,inset 0 0 0 5.5px #C9973E,0 4px 10px rgba(60,30,10,.25);display:flex;align-items:center;justify-content:center;gap:12px}
.b span{font-size:25px;color:#9E1B26}
.b em{width:7px;height:7px;background:#9E1B26;transform:rotate(45deg)}
.f{position:absolute;bottom:40px;left:0;right:0;text-align:center;font:500 13px Tajawal,sans-serif;color:#6b5a48}
.n{position:absolute;top:8px;right:10px;font:500 13px Tajawal;color:#fff;background:rgba(0,0,0,.45);padding:2px 10px;border-radius:9px;direction:ltr}
.amiri{font-family:Amiri,serif;font-weight:700}.messiri{font-family:"El Messiri",serif;font-weight:700}.kufi{font-family:"Reem Kufi",sans-serif;font-weight:700}
</style></head><body>
<script>
const arts=[['c_crest_1','1'],['c_majlis_1','3']], fonts=[['amiri','Amiri'],['messiri','El Messiri'],['kufi','Reem Kufi']];
for (const [a,n] of arts) for (const [f,fn] of fonts) document.write(`<div class="s"><div class="bg" style="background-image:url(${a}.jpg)"></div><div class="t ${f}"><h1>المعزّب</h1><div class="rule"><i></i><b></b><i></i></div><p>ليلة الأربعين</p></div><div class="b ${f}"><em></em><span>ادخل الديوانية</span><em></em></div><div class="f">الأبواب مفتوحة حتى الفجر</div><div class="n">${n} · ${fn}</div></div>`);
</script></body></html>
