<style>
body{margin:0;background:#2a2a2a;display:flex;gap:40px;padding:40px}
.card{position:relative;width:512px;height:768px;border-radius:30px;background:#F5EDDC;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");}
.frame{position:absolute;inset:18px;border:2px solid #C9973E;border-radius:18px}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid #C9973E;border-radius:14px;opacity:.7}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:Cinzel,serif;font-weight:700;color:#B3202C;font-size:52px;line-height:1}
.idx svg{width:34px;height:31px}
.tl{top:34px;left:34px}.br{bottom:34px;right:34px;transform:rotate(180deg)}
.art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:380px;max-height:620px}
