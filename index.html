<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>بلوت روغلايك</title>
    <!-- Inline so there is no separate request to 404 on. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b3d2e'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23ffd54a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Aref Ruqaa (SIL OFL) ships with the game: the menu buttons use it, and it must not
         depend on Google Fonts loading. */
      @font-face { font-family: "Aref Ruqaa"; font-weight: 700; font-display: swap;
        src: url("fonts/aref-ruqaa-700-arabic.woff2") format("woff2");
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Aref Ruqaa"; font-weight: 700; font-display: swap;
        src: url("fonts/aref-ruqaa-700-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F; }
    </style>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #173a4a;
        overflow: hidden;
        height: 100%;
        overscroll-behavior: none;
        font-family: "Tahoma", "Segoe UI", sans-serif;
      }
      /* 100vh on mobile is the viewport with the URL bar HIDDEN, so it runs taller than
         what's actually on screen — the bottom of the table (your hand) ends up cut off and
         pointer coordinates drift. 100dvh tracks the real visible viewport; 100vh is the
         fallback for browsers without dvh. */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="diag"></div>
    <script>
      // The app is a canvas, so any boot failure otherwise renders as a blank page with no
      // clue what went wrong — and a phone has no console to check. Surface it on screen.
      (function () {
        var RELOADED = "bloot:recovered";

        function show(title, detail) {
          var el = document.getElementById("diag");
          if (!el) return;
          el.style.cssText =
            "position:fixed;inset:0;padding:16px;overflow:auto;background:#0b3d2e;color:#fff;" +
            "font:13px/1.6 Tahoma,sans-serif;direction:rtl;text-align:right;z-index:9999";
          el.innerHTML =
            '<div style="font-size:17px;font-weight:bold;margin-bottom:10px">تعذّر تشغيل اللعبة</div>' +
            '<div style="color:#ffd54a;margin-bottom:12px">' +
            title +
            "</div>" +
            '<pre style="white-space:pre-wrap;word-break:break-all;background:#06251b;padding:10px;' +
            'border-radius:8px;font-size:11px;direction:ltr;text-align:left">' +
            detail +
            "</pre>" +
            '<div style="margin-top:12px;color:#9fc2ab">صوّر هذي الشاشة وأرسلها.</div>';
        }

        function diagnostics(extra) {
          var s = document.querySelector('script[type="module"]');
          return [
            "url: " + location.href,
            "script: " + (s ? s.src : "(none)"),
            "ua: " + navigator.userAgent,
            "screen: " + screen.width + "x" + screen.height + " dpr=" + window.devicePixelRatio,
            "viewport: " + innerWidth + "x" + innerHeight,
            extra || "",
          ].join("\n");
        }

        // A stale cached index.html points at a hashed bundle removed by the last deploy,
        // so the script 404s. That one is safely fixed by re-fetching cache-busted, once.
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") {
              if (!sessionStorage.getItem(RELOADED)) {
                sessionStorage.setItem(RELOADED, "1");
                location.replace(location.pathname + "?v=" + Date.now());
                return;
              }
              show("ملف اللعبة ما تحمّل (404).", diagnostics("script failed to load"));
            }
          },
          true,
        );

        // Anything else (the bundle loaded but threw) must be reported, never silently
        // reloaded away — a reload would just hide the real error behind a green screen.
        window.addEventListener("error", function (e) {
          if (e.message) show("خطأ أثناء التشغيل.", diagnostics(e.message + "\n" + (e.error && e.error.stack ? e.error.stack : "")));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("خطأ أثناء التشغيل.", diagnostics("unhandledrejection: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason))));
        });
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!window.__blootBooted) show("اللعبة ما اشتغلت خلال 8 ثواني.", diagnostics("boot timeout"));
          }, 8000);
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
