name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gamedev-skills-install-9ybem7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run build
      # The repo's Pages source is still "Deploy from a branch", so GitHub also runs its
      # legacy Jekyll build on every push. That one publishes the repo ROOT verbatim — where
      # index.html is the Vite *source* pointing at /src/main.ts, which 404s on a static host.
      # Both deployments target the same site, so whichever lands last wins, and the player
      # gets the real game or a dead page depending on the race. Force the source to Actions.
      - name: Force Pages source to GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages build_type=workflow -> HTTP $code"
          cat /tmp/pages.json || true
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Could not switch Pages source automatically. Set Settings -> Pages -> Source to 'GitHub Actions' by hand, otherwise the legacy branch build keeps overwriting this deploy."
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the Pages source is still a branch, GitHub also runs its legacy Jekyll build on
      # this same commit and publishes the repo root — the Vite source index.html, which is a
      # dead page. Both publish to the same site and the LAST one to finish wins, so the
      # player got the game or a 404 depending on which race we won that push. Let the legacy
      # build go first and land on top of it. Once the source is switched to GitHub Actions no
      # such run exists and this returns on the first poll.
      - name: Let the legacy branch build finish first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            body=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100") || body=""
            pending=$(printf '%s' "$body" | jq '[.workflow_runs[]? | select(.name == "pages build and deployment" and .status != "completed")] | length' 2>/dev/null)
            case "$pending" in
              ''|*[!0-9]*)
                echo "::warning::Could not read workflow runs; deploying without waiting."
                exit 0
                ;;
            esac
            echo "poll $i: legacy pages builds still running on this commit: $pending"
            if [ "$pending" -eq 0 ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::Legacy Pages build still running after ~7 minutes; deploying anyway."

      - id: deployment
        uses: actions/deploy-pages@v4
